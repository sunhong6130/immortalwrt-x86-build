name: Build ImmortalWrt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build OpenWrt
        uses: smallprogram/OpenWrtAction@main
        with:
          repo: immortalwrt/immortalwrt
          branch: openwrt-25.10
          x86: true
          diy_file: diy-part1.sh;diy-part2.sh
          config_file: .config
