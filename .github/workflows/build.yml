name: Build OpenWrt 25.12.6 (x86/64)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk g++ \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig unzip wget \
            zlib1g-dev file ccache

      - name: Clone OpenWrt v25.12.6
        run: |
          git clone --depth 1 --branch v25.12.6 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          cp ../.config ./
          cp ../diy-part*.sh ./
          chmod +x diy-part*.sh
          ./diy-part1.sh

      - name: Apply config and build
        run: |
          cd openwrt
          ./diy-part2.sh
          make defconfig
          make -j$(nproc) download || make -j1 download
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-x86-64-run${{ github.run_number }}
          path: |
            openwrt/bin/targets/x86/64/*squashfs-combined*.img.gz
            openwrt/bin/targets/x86/64/*rootfs.img.gz
            openwrt/bin/targets/x86/64/*kernel.bin
            openwrt/bin/targets/x86/64/sha256sums
          if-no-files-found: warn

