name: Build OpenWrt 25.12.6
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare env
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git bison flex libssl-dev python3 python3-pip unzip
      - name: Clone OpenWrt 25.12.6
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v25.12.6
          cp ../.config ./
          cp ../diy-part*.sh ./
          chmod +x diy-part*.sh
          ./diy-part1.sh
      - name: Build firmware
        run: |
          cd openwrt
          ./diy-part2.sh
          make -j$(nproc) V=s
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-25.12.6
          path: openwrt/bin/targets/x86/64/
