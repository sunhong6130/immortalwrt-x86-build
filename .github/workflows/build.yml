name: Build ImmortalWrt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build OpenWrt
        uses: P3TERX/Actions-OpenWrt@main
        with:
          repo: https://github.com/immortalwrt/immortalwrt
          branch: openwrt-25.10
          file: .config
          diy: diy-part1.sh;diy-part2.sh

