name: Build OpenWrt 25.12.6 (x86/64)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk g++ \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig unzip wget \
            zlib1g-dev file ccache

      - name: Clone OpenWrt v25.12.6
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write config and presets
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048

          # LuCI 基础 + 中文
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          # OpenVPN（官方界面同时支持客户端/服务端）
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-i18n-openvpn-zh-cn=y
          CONFIG_PACKAGE_openvpn-openssl=y

          # Web 服务
          CONFIG_PACKAGE_uhttpd=y

          # 防火墙 / nftables（firewall4 体系）
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_kmod-nft-offload=y

          # 网卡驱动（x86/64 常见）
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-i40e=y
          CONFIG_PACKAGE_kmod-r8169=y

          # USB 网卡驱动
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y

          # USB 主机 + 存储
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-uhci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y

          # 文件系统
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_exfat-fsck=y
          CONFIG_PACKAGE_exfat-mkfs=y

          # 网络服务 / 基础工具
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_odhcpd=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_nfs-utils=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          EOF

          # 首次启动默认简体中文（x86/64 默认网络 eth0=LAN/eth1=WAN 已符合要求，无需改写）
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-luci-lang <<'EOF'
          #!/bin/sh
          uci set luci.main.lang='zh-cn'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-luci-lang

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) download || make -j1 download
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-x86-64-run${{ github.run_number }}
          path: |
            openwrt/bin/targets/x86/64/*squashfs-combined*.img.gz
            openwrt/bin/targets/x86/64/sha256sums
          if-no-files-found: error
